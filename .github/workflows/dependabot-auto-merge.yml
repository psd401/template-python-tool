# Merges Dependabot's patch-level dev-dependency updates once the checks that
# main requires pass (psd-dev-standards 04 rule 4). Nothing else auto-merges.
# Needs: dev tools in a [dependency-groups] group (Dependabot labels them
# direct:development) and a ruleset on main requiring psd-ci / psd-ci. The
# auto-merge waits only for required checks, so the job refuses to enable it
# when main does not require that check. The merge uses GITHUB_TOKEN, so a
# push-triggered deploy on main does not run for it (psd-dev-standards#10).
name: Dependabot auto-merge
on: pull_request
permissions: {}
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Refuse unless main requires psd-ci
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-type == 'direct:development'
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | index("psd-ci / psd-ci")')
          if [ -z "$found" ] || [ "$found" = "null" ]; then
            echo "main does not require the psd-ci / psd-ci check; not enabling auto-merge"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto-merge patch-level dev-dependency updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-type == 'direct:development'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
